
spring.application.name=home_service_backend
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3307/home_service?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=user1
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Spring Session Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2s
spring.session.store-type=redis
spring.session.timeout=3d
spring.session.redis.namespace=home-service:session
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Spring AI Alibaba
spring.ai.dashscope.api-key=
spring.ai.dashscope.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.dashscope.chat.options.model=qwen3.8-27b
spring.ai.dashscope.enabled=true
spring.ai.dashscope.agent.enabled=true
spring.ai.vectorstore.type=none

# Agent
app.agent.model.enabled=true
# ???? API ??
app.agent.model.chat-api-key=
# ???? API ??
app.agent.model.embedding-api-key=
app.agent.model.embedding-base-url=http://localhost:11434/v1

# Milvus Modular RAG
# ???? Milvus Modular RAG
app.agent.rag.enabled=true
app.agent.rag.milvus-base-url=http://localhost:19530
app.agent.rag.collection=home_service_knowledge
app.agent.rag.has-collection-path=/v2/vectordb/collections/has
app.agent.rag.create-collection-path=/v2/vectordb/collections/create
app.agent.rag.search-path=/v2/vectordb/entities/search
app.agent.rag.insert-path=/v2/vectordb/entities/insert
app.agent.rag.delete-path=/v2/vectordb/entities/delete
app.agent.rag.top-k=8
app.agent.rag.max-context-chunks=6
app.agent.rag.timeout=5s

# AMap API Key
amap.api-key=
# JavaScript API 使用 Web-Map-Key；REST 地理编码使用上面的 Web-Service-Key
amap.web-api-key=
# 未提供 JS 安全密钥时留空，避免把另一枚 Web-Map-Key 当作 securityJsCode
amap.security-key=

# Tencent COS ??
tencent.cos.secret-id=
tencent.cos.secret-key=
# ??
tencent.cos.region=ap-beijing
# ??
tencent.cos.bucket=homeimage-1419823100
tencent.cos.connect-timeout=3s
tencent.cos.read-timeout=15s
tencent.cos.max-retries=2
tencent.cos.preview-ttl=15m
tencent.cos.max-file-size=5242880

# Stripe ????
# ???? Stripe ??
payment.stripe.enabled=true
payment.stripe.sandbox=true
payment.stripe.secret-key=
payment.stripe.api-base-url=https://api.stripe.com
payment.stripe.connect-timeout=3s
payment.stripe.read-timeout=8s
payment.stripe.max-retries=2

# Actuator ??
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
logging.level.com.example.home_service_backend=INFO
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
